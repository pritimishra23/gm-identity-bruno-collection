info:
  name: Get by UUID
  type: http
  seq: 4

http:
  method: GET
  url: "{{identity-base-url}}/admin/customer/details?id={{idp_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: X-Requested-From
      value: <<mission_name>>
  params:
    - name: id
      value: "{{idp_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
